<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals Guide · Active Physical Therapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F2;
  --ink:#16241E;
  --muted:#66756D;
  --line:#E7E0D2;
  --panel:#FFFFFF;

  --blue:#2F6FED;   --blue-tint:#E9F0FE;
  --orange:#E8792B; --orange-tint:#FDEEE1;
  --red:#E14B4B;    --red-tint:#FBEAEA;
  --purple:#9B51E0; --purple-tint:#F3E9FB;
  --teal:#12A594;   --teal-tint:#E2F6F3;
  --gold:#C89116;   --gold-tint:#FBF3DC;

  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --shadow:0 2px 6px rgba(22,36,30,.05), 0 16px 36px rgba(22,36,30,.08);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  padding-bottom:110px;
}
h1,h2,h3,button,.display{font-family:'Poppins',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ===== HEADER ===== */
.topbar{
  padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:14px;
  border-bottom:3px solid var(--ink); background:var(--bg); flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px; height:44px; border-radius:13px; background:var(--ink); color:var(--gold);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px;
}
.brand-text b{display:block; font-size:18px; font-weight:700;}
.brand-text span{display:block; font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.03em;}
.crumb{
  font-size:12.5px; color:var(--muted); font-weight:600; background:#fff; border:2px solid var(--line);
  padding:8px 14px; border-radius:100px;
}
.crumb b{color:var(--ink);}

main{max-width:880px; margin:0 auto; padding:32px 22px 20px;}

/* ===== HOME / TILE PICKER ===== */
.view{display:none;}
.view.active{display:block; animation:pop .25s ease;}
@keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.intro{margin-bottom:26px;}
.intro h1{font-size:clamp(26px,4vw,36px); font-weight:700; margin:0 0 10px; letter-spacing:-.01em;}
.intro p{font-size:14.5px; color:var(--muted); line-height:1.6; max-width:560px; margin:0;}

.tile-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:620px){.tile-grid{grid-template-columns:1fr;}}

.tile{
  background:var(--panel); border:2.5px solid var(--line); border-radius:var(--r-xl);
  padding:22px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:14px;
  transition:transform .15s, border-color .15s, box-shadow .15s;
}
.tile:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--tc);}
.tile .t-top{display:flex; align-items:center; justify-content:space-between;}
.tile .t-icon{
  width:48px; height:48px; border-radius:14px; background:var(--tt); color:var(--tc);
  display:flex; align-items:center; justify-content:center;
}
.tile .t-count{
  font-size:11px; font-weight:700; color:var(--tc); background:var(--tt); padding:5px 11px; border-radius:100px;
}
.tile h3{font-size:16.5px; font-weight:700; margin:0; letter-spacing:-.01em;}
.tile p{font-size:12.5px; color:var(--muted); margin:0; line-height:1.5;}
.tile .t-start{font-size:12.5px; font-weight:700; color:var(--tc); display:flex; align-items:center; gap:6px;}

.tile.rule{border-style:dashed;}

/* ===== PORTAL VIEW ===== */
.portal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.ph-title{display:flex; align-items:center; gap:14px;}
.ph-icon{width:46px; height:46px; border-radius:13px; background:var(--tt); color:var(--tc); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.ph-title h2{font-size:22px; font-weight:700; margin:0 0 3px; letter-spacing:-.01em;}
.ph-title span{font-size:12.5px; color:var(--muted); font-weight:600;}

.mode-switch{display:flex; background:#fff; border:2px solid var(--line); border-radius:100px; padding:4px;}
.mode-switch button{
  border:none; background:none; padding:8px 16px; border-radius:100px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer;
}
.mode-switch button.on{background:var(--ink); color:#fff;}

/* progress dots */
.dots{display:flex; gap:6px; margin-bottom:26px; flex-wrap:wrap;}
.dot{width:26px; height:6px; border-radius:100px; background:var(--line); transition:background .2s, width .2s;}
.dot.done{background:var(--tc);}
.dot.current{background:var(--ink); width:38px;}

/* wizard card */
.wizard-card{
  background:#fff; border:2.5px solid var(--ink); border-radius:var(--r-xl); padding:34px 30px 30px;
  box-shadow:var(--shadow); min-height:220px;
}
.wc-num{
  width:52px; height:52px; border-radius:16px; background:var(--tc); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin-bottom:18px;
}
.wc-title{font-size:20px; font-weight:700; margin:0 0 14px; letter-spacing:-.01em; line-height:1.3;}
.wc-body{font-size:14.5px; color:var(--ink); line-height:1.7;}
.wc-body p{margin:0 0 12px;}
.wc-body b{font-weight:700;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0;}
.chip{font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:100px; background:var(--tt); color:var(--tc);}

.box{border-radius:var(--r-md); padding:16px 18px; margin:10px 0; display:flex; gap:12px; align-items:flex-start; font-size:13.5px; line-height:1.6;}
.box.warn{background:var(--gold-tint); border:2px solid #eddba6; color:#6b4c0c;}
.box.danger{background:var(--red-tint); border:2px solid #f0cccc; color:#7a2626;}
.box.info{background:var(--blue-tint); border:2px solid #c7d7fc; color:#1a3699;}
.box svg{width:20px; height:20px; flex-shrink:0; margin-top:1px;}
.box b{font-weight:700;}

.cred-box{background:var(--ink); border-radius:var(--r-md); padding:16px 18px; display:flex; gap:16px; flex-wrap:wrap; margin:8px 0;}
.cred{flex:1; min-width:150px;}
.cred-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#9db3c9; font-weight:700; margin-bottom:6px;}
.cred-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,.08); padding:8px 12px; border-radius:9px;}
.cred-val{font-family:'JetBrains Mono'; font-size:14.5px; color:#fff;}
.copy-chip{background:rgba(255,255,255,.16); border:none; color:#fff; font-size:11px; font-weight:700; padding:6px 11px; border-radius:7px; cursor:pointer; flex-shrink:0;}
.copy-chip:hover{background:rgba(255,255,255,.28);}

.email-box{background:var(--bg); border:2px dashed var(--line); border-radius:var(--r-md); padding:16px; margin:10px 0;}
.email-box .eb-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.email-box .eb-label{font-size:11px; font-weight:700; color:var(--tc); text-transform:uppercase; letter-spacing:.06em;}
.email-box pre{font-family:'JetBrains Mono'; font-size:12.5px; line-height:1.7; white-space:pre-wrap; margin:0; background:#fff; border:1px solid var(--line); border-radius:9px; padding:14px;}
.email-box .copy-chip{background:var(--ink);}

.tel-link{color:var(--tc); font-weight:700; text-decoration:none; border-bottom:2px solid currentColor;}

.branch-q{font-weight:700; font-size:14.5px; margin-bottom:12px;}
.branch-btns{display:flex; gap:10px; margin-bottom:14px;}
.branch-btns button{
  flex:1; padding:13px; border-radius:var(--r-md); border:2.5px solid var(--line); background:#fff;
  font-size:13.5px; font-weight:700; cursor:pointer; color:var(--muted); font-family:'Inter';
}
.branch-btns button.on{border-color:var(--tc); background:var(--tt); color:var(--tc);}
.branch-panel{display:none;}
.branch-panel.on{display:block; animation:pop .2s ease;}

.checklist-inline{list-style:none; margin:0; padding:0;}
.checklist-inline li{
  display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5;
}
.checklist-inline li:last-child{border-bottom:none;}
.checklist-inline .li-dot{width:20px; height:20px; border-radius:6px; background:var(--tt); color:var(--tc); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; margin-top:1px;}

/* full list mode */
.list-steps{display:flex; flex-direction:column; gap:14px;}
.list-step{background:#fff; border:2px solid var(--line); border-radius:var(--r-lg); padding:20px 22px;}
.list-step .ls-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.list-step .ls-num{width:32px; height:32px; border-radius:10px; background:var(--tc); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.list-step .ls-title{font-weight:700; font-size:15px;}
.list-step .ls-body{font-size:13.5px; color:var(--ink); line-height:1.65; padding-left:44px;}

/* sticky footer nav */
.footer-nav{
  position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:3px solid var(--ink);
  padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; z-index:30;
}
.footer-nav .fn-info{font-size:12px; color:var(--muted); font-weight:600;}
.fn-btns{display:flex; gap:10px;}
.fn-btn{
  padding:13px 22px; border-radius:100px; font-size:14px; font-weight:700; cursor:pointer; border:2.5px solid var(--ink);
  font-family:'Poppins'; display:flex; align-items:center; gap:8px;
}
.fn-btn.ghost{background:#fff; color:var(--ink);}
.fn-btn.ghost:disabled{opacity:.35; cursor:not-allowed;}
.fn-btn.solid{background:var(--ink); color:#fff;}
.fn-btn svg{width:15px; height:15px;}

/* completion screen */
.done-screen{text-align:center; padding:50px 20px;}
.done-check{
  width:80px; height:80px; border-radius:50%; background:var(--tt); color:var(--tc);
  display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
}
.done-check svg{width:38px; height:38px;}
.done-screen h2{font-size:24px; margin:0 0 10px;}
.done-screen p{font-size:14px; color:var(--muted); max-width:420px; margin:0 auto 26px; line-height:1.6;}
.done-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:100px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; display:flex; align-items:center; gap:8px;
}
.toast svg{width:14px; height:14px; color:var(--gold);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" style="cursor:pointer" onclick="goHome()">
    <div class="brand-mark">P</div>
    <div class="brand-text"><b>Portals Guide</b><span>ACTIVE PHYSICAL THERAPY</span></div>
  </div>
  <div class="crumb" id="crumb">Pick a portal to start →</div>
</div>

<main>

  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="intro">
      <h1>One click. One step. No guesswork.</h1>
      <p>Tap a portal below and we'll walk you through it — one action at a time, with the info you need right when you need it. Nothing to memorize.</p>
    </div>
    <div class="tile-grid" id="tileGrid"></div>
  </section>

  <!-- PORTAL -->
  <section class="view" id="view-portal">
    <div class="portal-head">
      <div class="ph-title">
        <div class="ph-icon" id="phIcon"></div>
        <div><h2 id="phName"></h2><span id="phSub"></span></div>
      </div>
      <div class="mode-switch">
        <button class="on" id="modeWizardBtn" onclick="setMode('wizard')">🧭 Wizard</button>
        <button id="modeListBtn" onclick="setMode('list')">📋 Full list</button>
      </div>
    </div>

    <div id="dots" class="dots"></div>

    <div id="wizardWrap">
      <div class="wizard-card" id="wizardCard"></div>
    </div>

    <div id="listWrap" style="display:none;">
      <div class="list-steps" id="listSteps"></div>
    </div>

    <div class="done-screen" id="doneScreen" style="display:none;"></div>
  </section>

</main>

<div class="footer-nav" id="footerNav" style="display:none;">
  <div class="fn-info" id="fnInfo">Step 1 of 5</div>
  <div class="fn-btns">
    <button class="fn-btn ghost" id="btnBack" onclick="prevStep()">← Back</button>
    <button class="fn-btn solid" id="btnNext" onclick="nextStep()">Next →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============== ICONS ============== */
const ICONS = {
  ICON_BACK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  ICON_FWD:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  ICON_CHECK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  ICON_ALERT:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  ICON_INFO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  ICON_CLOCK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  ICON_KEY:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5 18 10M12.5 10.5 15 13"/></svg>',
  ICON_SCAN:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>',
  ICON_FILM:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>',
  ICON_DOC:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
  ICON_STAR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2Z"/></svg>',
};
function svg(name,size){ return ICONS[name].replace('<svg','<svg width="'+(size||18)+'" height="'+(size||18)+'"'); }

/* ============== DATA ============== */
const EMAIL_TMPL = "Greetings,\n\nAs a courtesy from The Injured Clients Medical Scheduling Network, we have retrieved and attached the medical records for your client [PT NAME] from [FACILITY] for the DOI [MM/DD/YYYY].\n\nPlease feel free to give us a call for any further assistance at 1-800-910-1742.\n\nThank you,";

function emailBox(id){
  return '<div class="email-box"><div class="eb-top"><span class="eb-label">Email / fax template</span><button class="copy-chip" data-copy-id="'+id+'">Copy</button></div><pre id="'+id+'">'+EMAIL_TMPL+'</pre></div>';
}

const PORTALS = {
  apmd:{
    name:'Attorney Portal Maryland (APMD)', color:'blue', icon:'ICON_KEY',
    subtitle:'Pacific Rehab · Active Rehab',
    steps:[
      {title:'Know which facilities this covers', body:`<p>This portal is used for records from:</p><div class="chip-row"><span class="chip">Pacific Rehab</span><span class="chip">Active Rehab</span></div>`},
      {title:'Log in to APMD', body:`<p>Use these credentials to log in:</p><div class="cred-box"><div class="cred"><div class="cred-label">Username</div><div class="cred-row"><span class="cred-val">NOffutt</span><button class="copy-chip" data-copy="NOffutt">Copy</button></div></div><div class="cred"><div class="cred-label">Password</div><div class="cred-row"><span class="cred-val">Pass@12345</span><button class="copy-chip" data-copy="Pass@12345">Copy</button></div></div></div>`},
      {title:'Go to Dashboard → Search Records', body:`<p>Open the <b>Dashboard</b> menu, then click <b>Search Records</b>.</p>`},
      {title:'Filter the patient', body:`<p>Filter using the patient's <b>date of birth</b> and/or <b>name</b>.</p>`},
      {title:"Can't find the patient?", body:`<div class="box info">${svg('ICON_INFO')}<div>Call <a class="tel-link" href="tel:14106857790">Maya at 410-685-7790</a> to confirm whether the patient is in the system.</div></div>`},
      {title:'Download every applicable document', body:`<div class="chip-row"><span class="chip">PT Notes</span><span class="chip">MD Notes</span><span class="chip">Disability Slips</span><span class="chip">Bills</span><span class="chip">Flowsheets</span></div><div class="box info">${svg('ICON_INFO')}<div>More than one document? Check the box in the upper-left corner of the blue section, then click <b>"Download Consolidate"</b> to grab everything at once.</div></div>`},
      {title:'Save with the portal date', body:`<p>Make sure each downloaded document is saved with the <b>date shown in the portal</b>.</p>`},
      {title:'Log the DOS when you upload', body:`<p>When uploading to the Attorney Portal, enter the matching <b>DOS (Date of Service)</b> in the Comments section of the patient profile.</p>`},
      {title:'Is the law firm already in the Attorney Portal?', body:`<div class="branch-q">Choose one:</div><div class="branch-btns"><button class="on" id="apmd-b-no" onclick="branch('apmd','no')">No, not in the portal</button><button id="apmd-b-yes" onclick="branch('apmd','yes')">Yes, it's in the portal</button></div><div class="branch-panel on" id="apmd-p-no"><p>Send the downloaded records directly to the law firm by email or fax.</p>${emailBox('em-apmd')}</div><div class="branch-panel" id="apmd-p-yes"><ol class="checklist-inline" style="list-style:decimal; padding-left:20px;"><li style="display:list-item;border:none;padding:6px 0;">Upload the records to the Attorney Portal.</li><li style="display:list-item;border:none;padding:6px 0;">Create only one initial file, as usual.</li><li style="display:list-item;border:none;padding:6px 0;">Click the eye icon to access the file and upload the rest there.</li><li style="display:list-item;border:none;padding:6px 0;">Save each doc as: <b>Exam Name</b> · <b>DOS</b> · <b>Exam Date</b>.</li></ol></div>`},
      {title:'Three rules to never break', body:`<div class="box warn">${svg('ICON_ALERT')}<div>Only search for <b>SPB records</b> when the facility indicates Maryland (MD) or MD &amp; PT.</div></div><div class="box danger">${svg('ICON_ALERT')}<div><b>Hospital Notes</b> are NEVER downloaded or uploaded anywhere.</div></div><div class="box info">${svg('ICON_INFO')}<div>Only mark the patient <b>purple</b> in the log once the specific record needed has been obtained. If something is still pending, leave a note saying which exam.</div></div>`},
    ]
  },
  rayus:{
    name:'Rayus Radiology', color:'orange', icon:'ICON_SCAN', subtitle:'Radiology portal',
    steps:[
      {title:"Can't find the patient?", body:`<div class="box info">${svg('ICON_INFO')}<div>Call the facility to confirm whether the patient attended the appointment.</div></div>`},
      {title:'Search the patient in Minicual', body:`<p>Look the patient up in <b>Minicual</b>.</p>`},
      {title:'Confirm the exam type', body:`<p>Double-check the <b>exam name/type</b> is correct before downloading.</p>`},
      {title:'Download the document', body:`<p>Click the <b>printer icon</b> to download it.</p>`},
      {title:'Save the file', body:`<p>Copy and paste the <b>original file name</b> exactly as it appears — don't rename it.</p>`},
      {title:'Is the patient in the Attorney Portal?', body:`<div class="branch-q">Choose one:</div><div class="branch-btns"><button class="on" id="rayus-b-no" onclick="branch('rayus','no')">No, not in the portal</button><button id="rayus-b-yes" onclick="branch('rayus','yes')">Yes, it's in the portal</button></div><div class="branch-panel on" id="rayus-p-no"><p>Send the request/records by email or fax.</p>${emailBox('em-rayus')}</div><div class="branch-panel" id="rayus-p-yes"><ol class="checklist-inline" style="list-style:decimal; padding-left:20px;"><li style="display:list-item;border:none;padding:6px 0;">Create a new file as usual.</li><li style="display:list-item;border:none;padding:6px 0;">Name it exactly: <span class="mono" style="background:var(--orange-tint);color:#a2500f;padding:2px 8px;border-radius:6px;">RayusRadiology_Documents</span></li><li style="display:list-item;border:none;padding:6px 0;">Click the eye icon.</li><li style="display:list-item;border:none;padding:6px 0;">Upload the remaining documents there.</li></ol></div>`},
    ]

  webchart:{
    name:'WebChart MD — Dr. Lippman', color:'red', icon:'ICON_DOC', subtitle:'Search & download portal',
    steps:[
      {title:'Click Search', body:`<p>Open the <b>Search</b> tool.</p>`},
      {title:'Type only the first 3 letters', body:`<p>Search using <b>only the first three letters</b> of the patient's first and last name.</p>`},
      {title:'Click Search All', body:`<p>Run the search across all records.</p>`},
      {title:'Download all available records', body:`<p>Grab every record that matches.</p>`},
      {title:'Save with name + DOI', body:`<p>Save the records using the <b>patient's name</b> and <b>DOI</b>.</p>`},
      {title:'Log the WebChartMD date', body:`<p>When uploading to the Attorney Portal, enter the date shown in WebChartMD in the notes/comments.</p>`},
      {title:'Is the patient in the Attorney Portal?', body:`<div class="branch-q">Choose one:</div><div class="branch-btns"><button class="on" id="webchart-b-no" onclick="branch('webchart','no')">No, not in the portal</button><button id="webchart-b-yes" onclick="branch('webchart','yes')">Yes, it's in the portal</button></div><div class="branch-panel on" id="webchart-p-no"><p>Send the request/records by email or fax.</p>${emailBox('em-webchart')}</div><div class="branch-panel" id="webchart-p-yes"><p>Great — upload the records to the file as usual, following the same naming rules as your other Attorney Portal uploads.</p></div>`},
      {title:'Double-check you have the right patient', body:`<div class="box danger">${svg('ICON_ALERT')}<div>Because we search with only 3 letters, WebChart can return a <b>different patient with a similar name</b>. Never assume the records match — confirm the appointment, doctor, or facility by checking the email or calling the facility.</div></div>`},
    ]
  },
  womri:{
    name:'WOMRI', color:'purple', icon:'ICON_FILM', subtitle:'Imaging report portal',
    steps:[
      {title:'Filter the patient', body:`<p>Filter by <b>Last Name</b> and <b>First Name</b>.</p>`},
      {title:'Download the report', body:`<p>Click <b>Send Report → Download → PDF</b>.</p>`},
      {title:'Rename the file', body:`<p>Add the <b>Study Description</b> to the file name.</p>`},
      {title:'Upload or send it', body:`<p>Upload the document to the Attorney Portal, or send it directly to the attorney.</p>`},
      {title:'Is the patient in the Attorney Portal?', body:`<div class="branch-q">Choose one:</div><div class="branch-btns"><button class="on" id="womri-b-no" onclick="branch('womri','no')">No, not in the portal</button><button id="womri-b-yes" onclick="branch('womri','yes')">Yes, it's in the portal</button></div><div class="branch-panel on" id="womri-p-no"><p>Send the request/records by email or fax.</p>${emailBox('em-womri')}</div><div class="branch-panel" id="womri-p-yes"><p>Upload the renamed PDF straight to the patient's file in the Attorney Portal.</p></div>`},
    ]
  },
  community:{
    name:'Community Radiology / Advanced Ortho', color:'teal', icon:'ICON_STAR', subtitle:'Community Radiology Connect',
    steps:[
      {title:'Know the delay first', body:`<div class="box warn">${svg('ICON_CLOCK')}<div>Reports aren't ready until about <b>2–3 days</b> after the patient's appointment. Don't search too early.</div></div>`},
      {title:'Click Search', body:`<p>Click the <b>magnifying glass</b> icon.</p>`},
      {title:'Include outside patients', body:`<p>Check the box <b>"Include Patients Outside My Practice."</b></p>`},
      {title:'Search by name + DOB', body:`<p>Search using the patient's <b>name</b> and <b>date of birth</b>.</p>`},
      {title:'Open the document', body:`<p>Locate the patient, then click the <b>paper/document icon</b> to the right of their name.</p>`},
      {title:'Save it with Ctrl + P', body:`<p>Use <b>Ctrl + P</b> to download/save the document.</p>`},
      {title:'Save with the right info', body:`<p>Save using: <b>Patient Name</b> · <b>Exam Type</b> · <b>DOS</b>.</p>`},
      {title:'Is the patient in the Attorney Portal?', body:`<div class="branch-q">Choose one:</div><div class="branch-btns"><button class="on" id="community-b-no" onclick="branch('community','no')">No, not in the portal</button><button id="community-b-yes" onclick="branch('community','yes')">Yes, it's in the portal</button></div><div class="branch-panel on" id="community-p-no"><p>Send the request/records by email or fax.</p>${emailBox('em-community')}</div><div class="branch-panel" id="community-p-yes"><p>Upload the saved document to the patient's existing file, following the standard naming rules.</p></div>`},
    ]
  },

    steps:[

      {title:'Keep the log updated', body:`<p>Clearly flag anything that's still pending.</p>`},
      {title:"Don't mark it purple too soon", body:`<div class="box warn">${svg('ICON_ALERT')}<div>Only mark the patient completed/purple once the <b>specific record needed</b> has actually been obtained.</div></div>`},

/* ============== STATE ============== */
let state = { portal:null, step:0, mode:'wizard' };

/* ============== HOME TILES ============== */
const colorMap = {blue:'#2F6FED',orange:'#E8792B',red:'#E14B4B',purple:'#9B51E0',teal:'#12A594',gold:'#C89116'};
const tintMap  = {blue:'#E9F0FE',orange:'#FDEEE1',red:'#FBEAEA',purple:'#F3E9FB',teal:'#E2F6F3',gold:'#FBF3DC'};

function buildTiles(){
  const grid = document.getElementById('tileGrid');
  Object.keys(PORTALS).forEach(id=>{
    const p = PORTALS[id];
    const tile = document.createElement('div');
    tile.className = 'tile'+(id==='rule'?' rule':'');
    tile.style.setProperty('--tc', colorMap[p.color]);
    tile.style.setProperty('--tt', tintMap[p.color]);
    tile.onclick = ()=>openPortal(id);
    tile.innerHTML = '<div class="t-top"><div class="t-icon">'+svg(p.icon,22)+'</div><span class="t-count">'+p.steps.length+' steps</span></div>'+
      '<div><h3>'+p.name+'</h3><p>'+p.subtitle+'</p></div>'+
      '<div class="t-start">Start guide '+svg('ICON_FWD',13)+'</div>';
    grid.appendChild(tile);
  });
}
buildTiles();

/* ============== NAV ============== */
function goHome(){
  document.getElementById('view-home').classList.add('active');
  document.getElementById('view-portal').classList.remove('active');
  document.getElementById('footerNav').style.display='none';
  document.getElementById('crumb').innerHTML = 'Pick a portal to start →';
  window.scrollTo({top:0,behavior:'smooth'});
}
function openPortal(id){
  state.portal=id; state.step=0; state.mode='wizard';
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-portal').classList.add('active');
  document.getElementById('doneScreen').style.display='none';
  document.getElementById('wizardWrap').style.display='';
  setMode('wizard');
  renderPortalHeader();
  renderDots();
  renderWizardStep();
  document.getElementById('footerNav').style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderPortalHeader(){
  const p = PORTALS[state.portal];
  document.getElementById('phIcon').innerHTML = svg(p.icon,22);
  document.getElementById('phIcon').style.background = tintMap[p.color];
  document.getElementById('phIcon').style.color = colorMap[p.color];
  document.getElementById('phName').textContent = p.name;
  document.getElementById('phSub').textContent = p.subtitle;
  document.getElementById('crumb').innerHTML = 'Portals Guide → <b>'+p.name+'</b>';
}
function renderDots(){
  const p = PORTALS[state.portal];
  const wrap = document.getElementById('dots');
  wrap.innerHTML='';
  wrap.style.setProperty('--tc', colorMap[p.color]);
  p.steps.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className='dot'+(i<state.step?' done':'')+(i===state.step?' current':'');
    d.style.background = i<=state.step ? colorMap[p.color] : '';
    wrap.appendChild(d);
  });
}
function renderWizardStep(){
  const p = PORTALS[state.portal];
  const s = p.steps[state.step];
  const card = document.getElementById('wizardCard');
  card.style.borderColor = colorMap[p.color];
  card.innerHTML = '<div class="wc-num" style="background:'+colorMap[p.color]+'">'+(state.step+1)+'</div>'+
    '<h3 class="wc-title">'+s.title+'</h3>'+
    '<div class="wc-body">'+s.body+'</div>';
  document.getElementById('fnInfo').textContent = 'Step '+(state.step+1)+' of '+p.steps.length;
  document.getElementById('btnBack').disabled = state.step===0;
  document.getElementById('btnNext').innerHTML = (state.step===p.steps.length-1 ? 'Finish '+svg('ICON_CHECK',15) : 'Next '+svg('ICON_FWD',15));
}
function nextStep(){
  const p = PORTALS[state.portal];
  if(state.step < p.steps.length-1){
    state.step++;
    renderDots();
    renderWizardStep();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    showDone();
  }
}
function prevStep(){
  if(state.step>0){
    state.step--;
    renderDots();
    renderWizardStep();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function showDone(){
  const p = PORTALS[state.portal];
  document.getElementById('wizardWrap').style.display='none';
  document.getElementById('listWrap').style.display='none';
  document.getElementById('footerNav').style.display='none';
  const done = document.getElementById('doneScreen');
  done.style.display='block';
  done.innerHTML = `<div class="done-check" style="background:${tintMap[p.color]};color:${colorMap[p.color]}">${svg('ICON_CHECK',38)}</div>
    <h2>Nice work!</h2><p>You have completed every step for <b>${p.name}</b>. Double-check the log is updated before moving to the next patient.</p>
    <div class="done-btns"><button class="fn-btn ghost" onclick="openPortal(&quot;${state.portal}&quot;)">Review again</button><button class="fn-btn solid" onclick="goHome()">Back to Portals Guide</button></div>`;
}

/* ============== MODE SWITCH ============== */
function setMode(mode){
  state.mode = mode;
  document.getElementById('modeWizardBtn').classList.toggle('on', mode==='wizard');
  document.getElementById('modeListBtn').classList.toggle('on', mode==='list');
  document.getElementById('wizardWrap').style.display = mode==='wizard' ? '' : 'none';
  document.getElementById('listWrap').style.display = mode==='list' ? '' : 'none';
  document.getElementById('dots').style.display = mode==='wizard' ? 'flex' : 'none';
  document.getElementById('footerNav').style.display = mode==='wizard' ? 'flex' : 'none';
  document.getElementById('doneScreen').style.display='none';
  if(mode==='list') renderList();
}
function renderList(){
  const p = PORTALS[state.portal];
  const wrap = document.getElementById('listSteps');
  wrap.innerHTML = p.steps.map((s,i)=>
    '<div class="list-step" style="border-color:'+colorMap[p.color]+'22"><div class="ls-head"><div class="ls-num" style="background:'+colorMap[p.color]+'">'+(i+1)+'</div><div class="ls-title">'+s.title+'</div></div><div class="ls-body">'+s.body+'</div></div>'
  ).join('');
}

/* ============== BRANCH TOGGLES ============== */
function branch(portal, which){
  document.getElementById(portal+'-b-no').classList.toggle('on', which==='no');
  document.getElementById(portal+'-b-yes').classList.toggle('on', which==='yes');
  document.getElementById(portal+'-p-no').classList.toggle('on', which==='no');
  document.getElementById(portal+'-p-yes').classList.toggle('on', which==='yes');
}

/* ============== COPY (event delegation) ============== */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.copy-chip');
  if(!btn) return;
  let text = btn.dataset.copy;
  if(btn.dataset.copyId){ text = document.getElementById(btn.dataset.copyId).textContent; }
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Copied!');
    const old = btn.textContent; btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=old,1200);
  }).catch(()=>showToast('Could not copy'));
});
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = svg('ICON_CHECK',14)+'<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
